<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Management Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-700 text-white py-6 shadow-md">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">📦 Logistics Tracker</h1>
                <p class="text-indigo-200 text-sm">Real-time shipment monitoring & search dashboard</p>
            </div>
            <a href="/swagger-ui.html" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm border border-indigo-400">
                Swagger Docs ↗
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">

        <!-- Search & Filter Controls -->
        <div class="bg-white p-6 rounded-xl shadow-sm mb-8 border border-slate-200">
            <h2 class="text-lg font-semibold text-slate-700 mb-4">Filter & Search Shipments</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Status</label>
                    <select id="statusFilter" class="w-full border-slate-300 rounded-lg p-2.5 border focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="In Transit">In Transit</option>
                        <option value="Out for Delivery">Out for Delivery</option>
                        <option value="Delivered">Delivered</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Recipient Name</label>
                    <input type="text" id="nameFilter" placeholder="e.g. Alice" class="w-full border-slate-300 rounded-lg p-2.5 border focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="flex items-end gap-2">
                    <button onclick="applyFilters()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg transition shadow-sm">
                        Apply Filters
                    </button>
                    <button onclick="resetFilters()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2.5 px-4 rounded-lg transition">
                        Reset
                    </button>
                </div>
            </div>
        </div>

        <!-- Shipments Table -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-slate-700">Shipment Directory</h2>
                <span id="shipmentCount" class="text-xs bg-indigo-100 text-indigo-700 font-semibold px-2.5 py-1 rounded-full">0 Shipments</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 uppercase text-xs tracking-wider border-b border-slate-200">
                            <th class="py-3.5 px-6">ID</th>
                            <th class="py-3.5 px-6">Recipient</th>
                            <th class="py-3.5 px-6">Delivery Address</th>
                            <th class="py-3.5 px-6">Weight (kg)</th>
                            <th class="py-3.5 px-6">Status</th>
                        </tr>
                    </thead>
                    <tbody id="shipmentsTableBody" class="divide-y divide-slate-200 text-sm">
                        <!-- Loaded dynamically via JS -->
                    </tbody>
                </table>
            </div>

            <!-- Empty State / Loading -->
            <div id="loadingState" class="p-8 text-center text-slate-500">
                Loading shipments...
            </div>
            <div id="emptyState" class="p-8 text-center text-slate-500 hidden">
                No matching shipments found.
            </div>
        </div>
    </main>

    <script>
        const API_BASE = '/api/shipments';

        // Load shipments on page load
        document.addEventListener('DOMContentLoaded', () => fetchShipments());

        async function fetchShipments(query = '') {
            const tableBody = document.getElementById('shipmentsTableBody');
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const shipmentCount = document.getElementById('shipmentCount');

            tableBody.innerHTML = '';
            loadingState.classList.remove('hidden');
            emptyState.classList.add('hidden');

            try {
                const url = query ? `${API_BASE}/search?${query}` : API_BASE;
                const response = await fetch(url);
                const shipments = await response.json();

                loadingState.classList.add('hidden');
                shipmentCount.innerText = `${shipments.length} Shipment${shipments.length === 1 ? '' : 's'}`;

                if (shipments.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                shipments.forEach(s => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50 transition';
                    row.innerHTML = `
                        <td class="py-4 px-6 font-mono text-xs font-bold text-slate-600">#${s.shipmentId || s.id || 'N/A'}</td>
                        <td class="py-4 px-6 font-medium text-slate-900">${escapeHtml(s.recipientName || '—')}</td>
                        <td class="py-4 px-6 text-slate-600">${escapeHtml(s.deliveryAddress || '—')}</td>
                        <td class="py-4 px-6 font-mono text-slate-600">${s.packageWeight ? s.packageWeight + ' kg' : '—'}</td>
                        <td class="py-4 px-6">${getStatusBadge(s.currentStatus)}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (err) {
                console.error("Failed to load shipments:", err);
                loadingState.innerText = "Error loading shipments. Ensure server is running.";
            }
        }

        function applyFilters() {
            const status = document.getElementById('statusFilter').value.trim();
            const name = document.getElementById('nameFilter').value.trim();

            const params = new URLSearchParams();
            if (status) params.append('status', status);
            if (name) params.append('name', name);

            fetchShipments(params.toString());
        }

        function resetFilters() {
            document.getElementById('statusFilter').value = '';
            document.getElementById('nameFilter').value = '';
            fetchShipments();
        }

        function getStatusBadge(status) {
            const st = (status || '').toLowerCase();
            let colorClasses = 'bg-slate-100 text-slate-700 border-slate-300';

            if (st.includes('pending')) colorClasses = 'bg-amber-100 text-amber-800 border-amber-300';
            else if (st.includes('transit')) colorClasses = 'bg-blue-100 text-blue-800 border-blue-300';
            else if (st.includes('out for delivery')) colorClasses = 'bg-purple-100 text-purple-800 border-purple-300';
            else if (st.includes('delivered')) colorClasses = 'bg-emerald-100 text-emerald-800 border-emerald-300';

            return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${colorClasses}">${status || 'Unknown'}</span>`;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
