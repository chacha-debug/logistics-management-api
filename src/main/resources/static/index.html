<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Shipment Dashboard</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-800">📦 Logistics Dashboard</h1>
            <button onclick="fetchShipments()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                Refresh Shipments
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Create Shipment Form -->
            <div class="bg-white p-6 rounded-lg shadow-md h-fit">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Create New Shipment</h2>
                <form id="shipmentForm" onsubmit="createShipment(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Customer ID</label>
                        <input type="number" id="customerId" value="1" required class="w-full border rounded p-2 text-sm mt-1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Driver ID</label>
                        <input type="number" id="driverId" value="1" required class="w-full border rounded p-2 text-sm mt-1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Package Weight (kg)</label>
                        <input type="number" step="0.01" id="packageWeight" placeholder="14.50" required class="w-full border rounded p-2 text-sm mt-1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Recipient Name</label>
                        <input type="text" id="recipientName" placeholder="Alice Smith" required class="w-full border rounded p-2 text-sm mt-1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Delivery Address</label>
                        <input type="text" id="deliveryAddress" placeholder="456 Oak Street, Kimberley" required class="w-full border rounded p-2 text-sm mt-1">
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white py-2 rounded font-medium hover:bg-green-700 transition">
                        Submit Shipment
                    </button>
                </form>
                <div id="formAlert" class="mt-4 text-sm font-medium hidden"></div>
            </div>

            <!-- Shipments List -->
            <div class="md:col-span-2 space-y-4">
                <h2 class="text-xl font-semibold text-gray-700">Active Shipments</h2>
                <div id="shipmentsContainer" class="space-y-4">
                    <p class="text-gray-500">Loading shipments...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api/shipments';

        // Fetch and display shipments
        async function fetchShipments() {
            const container = document.getElementById('shipmentsContainer');
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('Failed to fetch shipments');
                const shipments = await res.json();

                if (shipments.length === 0) {
                    container.innerHTML = `<p class="text-gray-500">No shipments found.</p>`;
                    return;
                }

                container.innerHTML = shipments.map(s => `
                    <div class="bg-white p-5 rounded-lg shadow-md border-l-4 ${s.currentStatus === 'Delivered' ? 'border-green-500' : 'border-blue-500'} flex justify-between items-center">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-lg text-gray-800">Shipment #${s.shipmentId}</span>
                                <span class="text-xs px-2 py-1 rounded bg-gray-100 text-gray-600 border">${s.currentStatus}</span>
                            </div>
                            <p class="text-sm text-gray-600 mt-1"><strong>Recipient:</strong> ${s.recipientName}</p>
                            <p class="text-sm text-gray-600"><strong>Address:</strong> ${s.deliveryAddress}</p>
                            <p class="text-sm text-gray-500 mt-1"><strong>Weight:</strong> ${s.packageWeight} kg</p>
                        </div>
                        <div class="text-right text-xs text-gray-400">
                            ${s.createdAt ? new Date(s.createdAt).toLocaleTimeString() : ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<p class="text-red-500">Error loading shipments: ${err.message}</p>`;
            }
        }

        // Submit new shipment via API
        async function createShipment(e) {
            e.preventDefault();
            const alertBox = document.getElementById('formAlert');
            alertBox.classList.add('hidden');

            const payload = {
                customer: { customerId: parseInt(document.getElementById('customerId').value) },
                driver: { driverId: parseInt(document.getElementById('driverId').value) },
                packageWeight: parseFloat(document.getElementById('packageWeight').value),
                recipientName: document.getElementById('recipientName').value,
                deliveryAddress: document.getElementById('deliveryAddress').value,
                currentStatus: "Pending"
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alertBox.textContent = 'Shipment created successfully!';
                    alertBox.className = 'mt-4 text-sm font-medium text-green-600 block';
                    document.getElementById('shipmentForm').reset();
                    fetchShipments();
                } else {
                    const errData = await res.json();
                    alertBox.textContent = errData.error || 'Failed to create shipment (check validation rules).';
                    alertBox.className = 'mt-4 text-sm font-medium text-red-600 block';
                }
            } catch (err) {
                alertBox.textContent = 'Network error connecting to backend.';
                alertBox.className = 'mt-4 text-sm font-medium text-red-600 block';
            }
        }

        // Initial Load
        fetchShipments();
    </script>
</body>
</html>
